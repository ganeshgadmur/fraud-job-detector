<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-danger">
    <div class="container">
        <span class="navbar-brand fw-bold">
            Fraud Job Detector
        </span>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0">Analysis Result</h5>
                </div>
                <div class="card-body">

                    <table class="table table-bordered">
                        <tr>
                            <th>Company</th>
                            <td th:text="${result.companyName}"></td>
                        </tr>
                        <tr>
                            <th>Job Title</th>
                            <td th:text="${result.jobTitle}"></td>
                        </tr>
                        <tr>
                            <th>Job Link</th>
                            <td th:text="${result.jobLink}"></td>
                        </tr>
                        <tr>
                            <th>Status</th>
                            <td>
                                <!-- Color coded status badge -->
                                <span th:if="${result.status == 'FRAUD'}"
                                      class="badge bg-danger fs-6">
                                    FRAUD
                                </span>
                                <span th:if="${result.status == 'SUSPICIOUS'}"
                                      class="badge bg-warning text-dark fs-6">
                                    SUSPICIOUS
                                </span>
                                <span th:if="${result.status == 'SAFE'}"
                                      class="badge bg-success fs-6">
                                    SAFE
                                </span>
                                <span th:if="${result.status == 'UNVERIFIED'}"
                                      class="badge bg-secondary fs-6">
                                    UNVERIFIED
                                </span>
                                <span th:if="${result.status == 'LOW_RISK'}"
                                      class="badge bg-info fs-6">
                                    LOW RISK
                                </span>
                            </td>
                        </tr>
						
						<tr>
							<th>Detected Reasons</th>
							<td>
							<ul class="mb-0">
							 <li th:each="reason : 
							${#strings.arraySplit(
							result.detectedReasons, '|')}"
							th:text ="${reason}"
							th:class="${result.status == 'FRAUD'}
							? 'text-danger' : (${result.status == 'SUSPICIOUS'}
							 ? 'text-warning' : 'text-success')">
						    </li>
						  </ul>
						</td>
					</tr>
										
                    </table>

                    <a href="/" class="btn btn-danger w-100">
                        Check Another Job
                    </a>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
