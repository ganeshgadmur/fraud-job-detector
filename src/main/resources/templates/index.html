<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Fraud Job Detector</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
          rel="stylesheet">
		  
		  <style>
			textarea::placeholder{
				color:#6c757d;
				opacity :1;
			}
			</style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-danger">
    <div class="container">
        <span class="navbar-brand fw-bold">
            Fraud Job Detector
        </span>
        <a href="/reports" 
           class="btn btn-outline-light btn-sm">
            View Reports
        </a>
        <a href="/admin" 
           class="btn btn-outline-light btn-sm">
            Admin Panel
        </a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0">Check Job Posting</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/submit}" 
                          th:object="${jobReport}" 
                          method="post">

                        <div class="mb-3">
                            <label class="form-label">
                                Company Name
                            </label>
                            <input type="text" 
                                   class="form-control"
                                   name="companyName">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Job Title
                            </label>
                            <input type="text" 
                                   class="form-control"
                                   name="jobTitle">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Job Link
                            </label>
                            <input type="text" 
                                   class="form-control"
                                   name="jobLink"
                                   placeholder="https://...">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Description
                            </label>
                            <textarea class="form-control" 
                                   name="description" 
                                    placeholder="Paste job description here."></textarea>
                        </div>

						<div class="mb-3">
						    <label class="form-label">
						        Your Personal Observation
						        <span class="text-muted">(optional)</span>
						    </label>
						    <textarea class="form-control" 
						              name="reportedReason" 
						              rows="2"
						              placeholder="Example: They asked for money, fake HR call, etc..."></textarea>
						</div>

                        <button type="submit" 
                                class="btn btn-danger w-100">
                            Check Job
                        </button>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
