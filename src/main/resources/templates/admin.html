<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand fw-bold">
            Admin Panel
        </span>
        <a href="/" class="btn btn-outline-light btn-sm">
            Home
        </a>
    </div>
</nav>

<div class="container mt-4">

    <!-- Filter buttons -->
    <div class="mb-3">
        <a href="/admin" 
           class="btn btn-dark btn-sm">All</a>
        <a href="/admin/filter?status=FRAUD" 
           class="btn btn-danger btn-sm">Fraud</a>
        <a href="/admin/filter?status=SUSPICIOUS" 
           class="btn btn-warning btn-sm">Suspicious</a>
        <a href="/admin/filter?status=SAFE" 
           class="btn btn-success btn-sm">Safe</a>
        <a href="/admin/filter?status=UNVERIFIED" 
           class="btn btn-secondary btn-sm">Unverified</a>
        <a href="/admin/filter?status=LOW_RISK" 
           class="btn btn-info btn-sm">Low Risk</a>
    </div>

    <table class="table table-bordered table-hover bg-white">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Company</th>
                <th>Job Title</th>
                <th>Link</th>
                <th>Status</th>
                <th>Update</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="report : ${reports}">
                <td th:text="${report.id}"></td>
                <td th:text="${report.companyName}"></td>
                <td th:text="${report.jobTitle}"></td>
                <td th:text="${report.jobLink}"></td>
                <td>
                    <span th:if="${report.status == 'FRAUD'}"
                          class="badge bg-danger">FRAUD</span>
                    <span th:if="${report.status == 'SUSPICIOUS'}"
                          class="badge bg-warning text-dark">
                          SUSPICIOUS</span>
                    <span th:if="${report.status == 'SAFE'}"
                          class="badge bg-success">SAFE</span>
                    <span th:if="${report.status == 'UNVERIFIED'}"
                          class="badge bg-secondary">
                          UNVERIFIED</span>
                    <span th:if="${report.status == 'LOW_RISK'}"
                          class="badge bg-info">LOW RISK</span>
                </td>

                <!-- Update form -->
                <td>
                    <form th:action="@{/admin/update/{id}
                        (id=${report.id})}" 
                        method="post" 
                        class="d-flex gap-1">
                        <select name="status" 
                                class="form-select form-select-sm">
                            <option value="SAFE">SAFE</option>
                            <option value="FRAUD">FRAUD</option>
                            <option value="SUSPICIOUS">
                                SUSPICIOUS</option>
                            <option value="UNVERIFIED">
                                UNVERIFIED</option>
                            <option value="LOW_RISK">
                                LOW RISK</option>
                        </select>
                        <button type="submit" 
                                class="btn btn-primary btn-sm">
                            Update
                        </button>
                    </form>
                </td>

                <!-- Delete form -->
                <td>
                    <form th:action="@{/admin/delete/{id}
                        (id=${report.id})}" 
                        method="post">
                        <button type="submit" 
                                class="btn btn-danger btn-sm"
                                onclick="return confirm(
                                'Are you sure?')">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
